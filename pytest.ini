[pytest]
markers =
    unit: fast isolated checks
    integration: multi-component checks
    rag: RAG pipeline checks
    extraction: file extraction checks
    analyser: memo analyser checks
    ui: Streamlit UI checks
    gates: release gate checks
    bdd: Gherkin acceptance checks
    negative: negative cases
    edge: edge cases
    ai_pattern: AI-specific patterns
testpaths = tests
